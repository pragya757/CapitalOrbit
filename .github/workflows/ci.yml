name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-secret-key-123456789"
      RAZORPAY_KEY_ID: "rzp_test_TSVHW3c3AMEkWV"
      RAZORPAY_KEY_SECRET: "4BMoupzEyun0QPMZ8OHOyOIG"
      NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_TSVHW3c3AMEkWV"
      NODE_ENV: "test"

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma Client & Push DB Schema
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
        
      - name: Run Vitest Unit Tests
        run: npx vitest run
        
      - name: Build Next.js Production App
        run: npm run build
